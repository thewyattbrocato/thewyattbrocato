    <circle cx="1178" cy="322" r="34" fill="#c8f6a5" stroke="#073e31" stroke-width="2"/>
    <path d="M1164 322 L1175 333 L1193 311" fill="none" stroke="#073e31" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="'SF Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#0f5944" text-anchor="middle">
      <text x="1178" y="372">HUMAN REVIEW</text>
