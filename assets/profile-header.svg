<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Wyatt Brocato — Practical AI work systems">
  <title>Wyatt Brocato — Practical AI work systems</title>
  <rect x="1" y="1" width="1278" height="398" rx="12" fill="#f2fde6" stroke="#073e31" stroke-width="2"/>
  <g stroke="#d8e6cd" stroke-width="1">
    <path d="M0 96 H820"/>
    <path d="M0 304 H820"/>
  </g>
  <g font-family="'SF Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
    <text x="72" y="118" font-size="22" letter-spacing="6" fill="#0f5944">PRACTICAL AI WORK SYSTEMS</text>
  </g>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="196" font-size="76" font-weight="700" fill="#101610">Wyatt Brocato</text>
    <text x="72" y="248" font-size="29" fill="#536052">Turn rough inputs into work you can stand behind.</text>
  </g>
  <g font-family="'SF Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" fill="#536052">
    <text x="72" y="286">evidence before confidence &#183; build leverage</text>
  </g>
  <g>
    <line x1="820" y1="24" x2="820" y2="376" stroke="#d8e6cd" stroke-width="2"/>
    <g font-family="'SF Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
      <text x="864" y="52" font-size="15" letter-spacing="3" fill="#0f5944">THE PROOF MACHINE</text>
    </g>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <rect x="864" y="66" width="344" height="96" rx="10" fill="#fffef9" stroke="#073e31" stroke-width="2"/>
      <text x="880" y="92" font-size="13" font-weight="700" fill="#0f5944">Messy inputs</text>
      <rect x="880" y="102" width="200" height="12" rx="6" fill="#f2fde6" stroke="#d8e6cd" stroke-width="1"/>
      <rect x="880" y="120" width="150" height="12" rx="6" fill="#f2fde6" stroke="#d8e6cd" stroke-width="1"/>
      <rect x="880" y="138" width="178" height="12" rx="6" fill="#f2fde6" stroke="#d8e6cd" stroke-width="1"/>
      <g font-family="'SF Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
        <text x="996" y="196" font-size="14" letter-spacing="2" fill="#0f5944">AI STRUCTURES &#8595;</text>
      </g>
      <rect x="864" y="210" width="344" height="124" rx="10" fill="#fffef9" stroke="#073e31" stroke-width="2"/>
      <text x="880" y="236" font-size="13" font-weight="700" fill="#0f5944">Reviewed brief</text>
      <text x="880" y="260" font-size="14" fill="#101610"><tspan font-weight="700">Outcome:</tspan> grouped with evidence</text>
      <text x="880" y="284" font-size="14" fill="#101610"><tspan font-weight="700">Decision:</tspan> visible, owner named</text>
      <text x="880" y="308" font-size="14" fill="#101610"><tspan font-weight="700">Next:</tspan> gaps marked, not invented</text>
