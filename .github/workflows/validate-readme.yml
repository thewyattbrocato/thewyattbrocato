name: Validate README

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readme:
    name: README links and images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate README links and image assets
        run: node scripts/check-readme-links.mjs README.md PINNING.md
